<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  html, body {
    width: 100%;
    overflow: hidden;
    background: #0d0d0d;
  }
</style>
</head>
<body>

<script>
  // ----------------------------------------------------------------
  // MOST: implementacja protokolu "Streamlit Components v1" w czystym
  // JS (bez React/npm) - pozwala grze zglosic wynik z powrotem do
  // Pythona, dzieki czemu etap zalicza sie sam.
  //
  // WAZNE (dzwiek): gra jest wstrzykiwana BEZPOSREDNIO do TEGO
  // dokumentu, a NIE do zagniezdzonego <iframe>. Przegladarki blokuja
  // Web Audio w zagniezdzonej ramce, dopoki strona nadrzedna nie
  // przekaze jej uprawnienia - a nadrzedna ramka nalezy do Streamlita
  // i nie mamy nad nia kontroli. Renderujac gre tutaj, jestesmy na
  // dokladnie tym samym poziomie zagniezdzenia co dawniej, kiedy
  // dzwiek dzialal.
  // ----------------------------------------------------------------

  var SET_COMPONENT_VALUE = "streamlit:setComponentValue";
  var RENDER = "streamlit:render";
  var COMPONENT_READY = "streamlit:componentReady";
  var SET_FRAME_HEIGHT = "streamlit:setFrameHeight";

  var wysokoscRamki = 560;
  var jujWypelniona = false;
  var jujZaliczono = false;

  function _wyslijDoStreamlit(typ, dane) {
    var wychodzace = Object.assign({
      isStreamlitMessage: true,
      type: typ,
    }, dane || {});
    window.parent.postMessage(wychodzace, "*");
  }

  function ustawWysokoscRamki(wysokosc) {
    _wyslijDoStreamlit(SET_FRAME_HEIGHT, { height: wysokosc });
  }

  function zglosWynikDoPythona(wartosc) {
    _wyslijDoStreamlit(SET_COMPONENT_VALUE, { value: wartosc, dataType: "json" });
  }

  // Wstrzykuje pelny dokument gry (HTML+CSS+JS) do biezacej strony.
  // innerHTML NIE uruchamia <script>, wiec skrypty trzeba odtworzyc
  // recznie jako nowe elementy - inaczej gra w ogole by nie ruszyla.
  function wstawGre(htmlGry) {
    var parser = new DOMParser();
    var dokumentGry = parser.parseFromString(htmlGry, "text/html");

    Array.prototype.forEach.call(dokumentGry.querySelectorAll("style"), function (styl) {
      var nowyStyl = document.createElement("style");
      nowyStyl.textContent = styl.textContent;
      document.head.appendChild(nowyStyl);
    });

    var skrypty = Array.prototype.slice.call(dokumentGry.querySelectorAll("script"));
    skrypty.forEach(function (s) { s.parentNode.removeChild(s); });

    var pojemnik = document.createElement("div");
    pojemnik.id = "pojemnik-gry";
    pojemnik.innerHTML = dokumentGry.body.innerHTML;
    document.body.appendChild(pojemnik);

    if (dokumentGry.body.className) {
      document.body.className = dokumentGry.body.className;
    }

    // Skrypty dopiero PO wstawieniu HTML - kod gry szuka elementow
    // przez getElementById juz przy starcie.
    skrypty.forEach(function (staryS) {
      var nowyS = document.createElement("script");
      if (staryS.src) {
        nowyS.src = staryS.src;
      } else {
        nowyS.textContent = staryS.textContent;
      }
      document.body.appendChild(nowyS);
    });
  }

  window.addEventListener("message", function (event) {
    var dane = event.data;
    if (!dane || typeof dane !== "object") return;

    // Kanal 1: wiadomosc OD Streamlit (argumenty z Pythona)
    if (dane.type === RENDER) {
      var argumenty = dane.args || {};
      if (argumenty.wysokosc) {
        wysokoscRamki = argumenty.wysokosc;
      }
      if (!jujWypelniona && typeof argumenty.html_gry === "string") {
        jujWypelniona = true;
        wstawGre(argumenty.html_gry);
      }
      ustawWysokoscRamki(wysokoscRamki);
      return;
    }

    // Kanal 2: wiadomosc OD GRY - zaliczenie etapu. Gra siedzi teraz w
    // tym samym dokumencie, wiec wiadomosc przychodzi z tego samego okna.
    if (dane.type === "streamlit-child:zaliczono") {
      if (!jujZaliczono) {
        jujZaliczono = true;
        zglosWynikDoPythona(dane.wartosc === undefined ? true : dane.wartosc);
      }
    }
  });

  _wyslijDoStreamlit(COMPONENT_READY, { apiVersion: 1 });

  window.addEventListener("load", function () {
    window.setTimeout(function () { ustawWysokoscRamki(wysokoscRamki); }, 0);
  });
</script>
</body>
</html>
